 ["كمية بيانات ضخمة أحللها.","D4 A2 Q1"],
 ["شاشة ممتازة للتصميم.","F4 G1 S1"]]),
q("لو مشروع فشل، غالباً السبب هيكون:",[
 ["ضعف في الحماية.","X4 C1 O1"],
 ["خطة مش مرنة ومش بتكبر مع المشروع.","S3 C3 B1"],
 ["معلومات غلط أو مش منظمة.","D3 Q3 A1"],
 ["تجربة استخدام سيئة.","F4 G1 S1"]]),
q("إيه حلمك المهني؟",[
 ["أنشر لعبة تحقق ملايين التحميلات.","G4 F2 S1"],
 ["أبني ذكاء اصطناعي يفيد المجتمع.","A4 D2 S1"],
 ["أدير الأنظمة اللي بتشغل شركة عالمية.","C4 O3"],
 ["أكون هاكر أخلاقي بيحمي الشركات.","X4 O1 C1"]]),
q("لما حاجة بتتعطل، بتحب:",[
 ["أدور على سببها خطوة بخطوة جوه البرنامج.","S3 B3 G1"],
 ["أتابع اللي بيظهر قدامي على الشاشة.","F4 G2 S1"],
 ["أفتح السجلات وأدور على أدلة.","O3 D2 X2"],
 ["أتأكد إن المعلومات نفسها سليمة.","Q4 D2 B1"]]),
q("لو هتنصح مبتدئ، تنصحه يبدأ بإيه؟",[
 ["يبني صفحة ويب بسيطة.","F4 B1 S1"],
 ["يتعلم Python وتحليل الأرقام.","D3 A3 B1"],
 ["يتعلم Linux وأساسيات الشبكات.","O3 X3 C1"],
 ["يتعلم C++ أو C# ويعمل بيهم ألعاب.","G3 S3 A1"]])
];

/* ============ ENGINE ============ */
const KEYS=Object.keys(T);
// theoretical max per track = sum of best weight per question
const MAX=Object.fromEntries(KEYS.map(k=>[k,Q.reduce((s,qq)=>s+Math.max(0,...qq.o.map(o=>o.w[k]||0)),0)]));
function compute(ans){
  const raw=Object.fromEntries(KEYS.map(k=>[k,0]));
  ans.forEach((a,i)=>{ if(a==null)return; const w=Q[i].o[a].w; for(const k in w) raw[k]+=w[k]; });
  // fuzzy membership: ratio to reachable max, softened with sqrt so partial matches stay meaningful
  return KEYS.map(k=>({k,name:T[k],raw:raw[k],pct:Math.round(Math.sqrt(raw[k]/MAX[k])*1000)/10}))
             .sort((a,b)=>b.pct-a.pct||b.raw-a.raw);
}

/* ============ STATE ============ */
const LS='mish_hackers_quiz_v1';
let st={screen:'welcome',i:0,ans:Array(Q.length).fill(null)};
try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.ans&&s.ans.length===Q.length)st=s;}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};
const view=document.getElementById('view');
const ar=n=>n.toLocaleString('ar-EG');

function go(fn){
  const el=view.firstElementChild;
  if(el){el.classList.add('out');setTimeout(()=>{fn();},230);}else fn();
}
function render(){
  if(st.screen==='welcome')welcome();
  else if(st.screen==='quiz')quiz();
  else result();
  save();
}
function mount(html){view.innerHTML=`<div class="screen">${html}</div>`;window.scrollTo({top:0,behavior:'smooth'});}

/* ============ SCREENS ============ */
function welcome(){
  const resume=st.ans.some(a=>a!=null);
  mount(`<div class="card p-6 text-center">
    <h2 class="text-2xl font-black mb-2">اكتشف مسارك التقني</h2>
    <p class="text-sm leading-7 mb-1">٣٠ سؤال بسيط بنحلل بيهم شخصيتك ونطلعلك نسبة توافقك مع <span class="en font-bold">10 Technical Tracks</span>.</p>
    <p class="text-xs opacity-70 mb-5">مش لازم تكون عندك أي خلفية تقنية، ومفيش إجابة صح أو غلط. اختار اللي بيشبهك فعلاً.</p>
    <button id="start" class="btn text-lg w-full">${resume?'كمّل الاختبار':'ابدأ الاختبار'}</button>
    ${resume?'<button id="fresh" class="btn ghost w-full mt-3 text-sm">ابدأ من الأول</button>':''}
  </div>`);
  document.getElementById('start').onclick=()=>go(()=>{
    if(!resume){st={screen:'quiz',i:0,ans:Array(Q.length).fill(null)};}
    else{st.screen='quiz';st.i=Math.min(st.ans.findIndex(a=>a==null)<0?Q.length-1:st.ans.findIndex(a=>a==null),Q.length-1);}
    render();});
  const f=document.getElementById('fresh');
  if(f)f.onclick=()=>go(()=>{st={screen:'quiz',i:0,ans:Array(Q.length).fill(null)};render();});
}

function quiz(){
  const i=st.i,qq=Q[i],pct=(i/Q.length)*100;
  mount(`<div class="card p-5">
    <div class="flex justify-between text-sm font-bold mb-2"><span>السؤال ${ar(i+1)} من ${ar(Q.length)}</span><span>${ar(Math.round(pct))}٪</span></div>
    <div class="bar mb-5"><i id="pb" style="width:${pct}%"></i></div>
    <h2 class="text-lg font-black leading-8 mb-4">${qq.t}</h2>
    <div class="space-y-3" id="opts">
      ${qq.o.map((o,n)=>`<button class="opt ${st.ans[i]===n?'sel':''}" data-n="${n}">${o.x}</button>`).join('')}
    </div>
    <div class="flex justify-between mt-5">
      <button id="prev" class="btn ghost" ${i===0?'disabled':''}>السابق</button>
      <button id="next" class="btn" ${st.ans[i]==null?'disabled':''}>${i===Q.length-1?'اعرض النتيجة':'التالي'}</button>
    </div></div>`);
  requestAnimationFrame(()=>{const p=document.getElementById('pb');if(p)p.style.width=((i+1)/Q.length*100)+'%';});
  const next=()=>go(()=>{if(i===Q.length-1){st.screen='result';}else st.i++;render();});
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    st.ans[i]=+b.dataset.n;save();
    document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
    document.getElementById('next').disabled=false;
    setTimeout(next,320);
  });
  document.getElementById('next').onclick=next;
  document.getElementById('prev').onclick=()=>go(()=>{st.i--;render();});
}

function result(){
  const r=compute(st.ans),top=r[0],info=INFO[top.k];
  mount(`<div class="card p-6 text-center">
    <p class="text-sm font-bold opacity-80">مسارك الأنسب هو</p>
    <div class="text-6xl my-2 reveal">${info.i}</div>
    <h2 class="en text-2xl font-black text-[#b3202a] reveal" style="animation-delay:.2s">${top.name}</h2>
    <div class="glow text-7xl font-black my-3 reveal" style="animation-delay:.5s;color:#b3202a"><span id="big" class="en">0</span><span class="en">%</span></div>
    <p class="text-sm font-bold mb-2">نسبة التوافق</p>
    <p class="leading-8 text-[15px] text-right bg-[#f3e6c8] border border-[#1b1717] rounded-xl p-4 mt-3">${info.d}</p>
  </div>
  <div class="card p-5 mt-5">
    <h3 class="font-black mb-4">باقي المسارات</h3>
    <div class="space-y-4">
    ${r.slice(1).map((t,n)=>`<div>
      <div class="flex justify-between text-sm font-bold mb-1"><span class="en">${INFO[t.k].i} ${t.name}</span><span class="en">${t.pct.toFixed(1)}%</span></div>
      <div class="bar"><i data-w="${t.pct}" style="transition-delay:${n*90}ms"></i></div></div>`).join('')}
    </div>
    <div class="grid grid-cols-2 gap-3 mt-6">
      <button id="retake" class="btn ghost">إعادة الاختبار</button>
      <button id="share" class="btn">مشاركة النتيجة</button>
    </div><p id="msg" class="text-center text-xs mt-3 h-4"></p>
  </div>`);
  // count up
  const big=document.getElementById('big'),t0=performance.now(),D=1800;
  (function tick(n){const p=Math.min((n-t0)/D,1);big.textContent=(top.pct*(1-Math.pow(1-p,3))).toFixed(1);if(p<1)requestAnimationFrame(tick);})(t0);
  setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),400);
  document.getElementById('retake').onclick=()=>go(()=>{st={screen:'welcome',i:0,ans:Array(Q.length).fill(null)};render();});
  document.getElementById('share').onclick=async()=>{
    const txt=`حصلت على ${top.pct.toFixed(1)}% توافق مع مسار ${top.name} في اختبار Mish Hackers! 🔥\nجرّب انت كمان: ${location.href}`;
    const m=document.getElementById('msg');
    try{ if(navigator.share){await navigator.share({title:'Mish Hackers',text:txt});}
         else{await navigator.clipboard.writeText(txt);m.textContent='تم نسخ النتيجة ✓';} }
    catch(e){ m.textContent='تعذّرت المشاركة'; }
  };
}

/* petals */
(function(){const c=document.getElementById('petals');
for(let i=0;i<14;i++){const p=document.createElement('span');p.className='petal';
p.style.left=Math.random()*100+'vw';p.style.animationDuration=(8+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*12)+'s';
p.style.transform=`scale(${.6+Math.random()})`;c.appendChild(p);}})();

render();
</script>
</body>
</html>
